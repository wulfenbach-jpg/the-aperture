[workspace]
members = [
    "crates/core",
    "crates/import",
    "crates/ai",
    "crates/cli",
    "crates/ui",
    "crates/eval",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "json",
    "native-tls",
    "charset",
] }
eframe = "0.37.0"
egui = "0.37.0"
png = "0.18.1"

[profile.release]
opt-level = 2
debug = false
