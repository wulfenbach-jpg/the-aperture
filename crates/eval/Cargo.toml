[package]
name = "aperture-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Reproducible paired-seed evaluation driver for THE APERTURE policies: builds raw reports, replays and disclosed-confidence summaries."

[dependencies]
aperture-core = { path = "../core" }
aperture-ai = { path = "../ai" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
[[bin]]
name = "aperture-eval"
path = "src/main.rs"

[lib]
name = "aperture_eval"
path = "src/lib.rs"
